[package]
name = "agent-terminal"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["gui"]
gui = [
    "dep:flume",
    "dep:gpui",
    "dep:gpui_platform",
    "dep:interprocess",
    "dep:libc",
    "dep:portable-pty",
    "dep:ring",
    "dep:windows-sys",
]

[dependencies]
flume = { version = "0.12", optional = true }
gpui = { git = "https://github.com/zed-industries/zed", rev = "fa00dccc42311f8dc71c533105488b0dbd518138", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fa00dccc42311f8dc71c533105488b0dbd518138", optional = true, features = ["wayland", "x11"] }
interprocess = { version = "2.4.2", optional = true }
ring = { version = "0.17", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
portable-pty = { version = "0.9", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[build-dependencies]
cc = "1"

[[test]]
name = "resident_core"
required-features = ["gui"]
