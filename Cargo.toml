[package]
name = "agent-terminal"
version = "0.0.0"
edition = "2024"
publish = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 0

[profile.test.package."*"]
opt-level = 0

[features]
default = ["gui"]
gui = [
    "dep:directories",
    "dep:flume",
    "dep:gpui",
    "dep:gpui_platform",
    "dep:interprocess",
    "dep:ksni",
    "dep:libc",
    "dep:portable-pty",
    "dep:ring",
    "dep:tray-icon",
    "dep:windows-version",
    "dep:windows-sys",
]

[dependencies]
directories = { version = "6", optional = true }
flume = { version = "0.12", optional = true }
gpui = { git = "https://github.com/zed-industries/zed", rev = "fa00dccc42311f8dc71c533105488b0dbd518138", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fa00dccc42311f8dc71c533105488b0dbd518138", optional = true, features = ["font-kit", "wayland", "x11"] }
interprocess = { version = "2.4.2", optional = true }
ring = { version = "0.17", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
portable-pty = { version = "0.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"], optional = true }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = { version = "=0.24.2", default-features = false, features = ["common-controls-v6"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-version = { version = "0.1.7", optional = true }
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[build-dependencies]
cc = "1"

[[test]]
name = "resident_core"
required-features = ["gui"]
